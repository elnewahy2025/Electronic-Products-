<style>
:root{--bar:#0a2a24;--ink:#e8f5f0;--mute:#8fb7aa;--line:#245a4d;--on:#e8f5f0;--onink:#0a2a24;color-scheme:light dark}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{display:flex;flex-direction:column;font:400 14px/1.5 "IBM Plex Sans Arabic",Tahoma,sans-serif;background:#f3f5f7}

.top{background:var(--bar);color:var(--ink);display:flex;align-items:stretch;gap:6px;padding:0 14px;min-height:54px;flex:none;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;font-weight:700;font-size:16px;padding-inline-end:14px;margin-inline-end:6px;border-inline-end:1px solid var(--line);white-space:nowrap}
.tabs{display:flex;gap:4px;overflow-x:auto;align-items:flex-end;flex:1}
.tabs button{background:none;border:0;border-bottom:3px solid transparent;color:var(--mute);padding:7px 14px 6px;cursor:pointer;text-align:start;font:inherit;display:flex;flex-direction:column;white-space:nowrap}

&lt;html lang=&quot;ar&quot; dir=&quot;rtl&quot;&gt;

&lt;base href=&quot;about:srcdoc&quot;&gt;

&lt;title&gt;متجر المنتجات الإلكترونية — عرض تصميم&lt;/title&gt;
&lt;link rel=&quot;stylesheet&quot; href=&quot;https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&amp;display=swap&quot;&gt;
&lt;style&gt;
:root{--paper:#f3f5f7;--card:#fff;--ink:#0f1b26;--mute:#5d6b78;--line:#d8dee4;--blue:#1457d9;--blue-ink:#fff;--green:#17855b;--amber:#e8a317;--soft:#e9eef5;--pcb:#0d3b32;color-scheme:light}
@media(prefers-color-scheme:dark){:root{--paper:#0c1219;--card:#141d27;--ink:#e8eef4;--mute:#92a1af;--line:#26323f;--blue:#6f9bff;--blue-ink:#0c1219;--green:#4cc796;--amber:#f0b73a;--soft:#1b2733;--pcb:#0a2a24;color-scheme:dark}}
*{box-sizing:border-box}html{scroll-padding-top:70px}
body{margin:0;background:var(--paper);color:var(--ink);font:400 15px/1.7 &quot;IBM Plex Sans Arabic&quot;,Tahoma,&quot;Segoe UI&quot;,sans-serif}
a{color:inherit;text-decoration:none}button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px;border-radius:6px}
.wrap{max-width:1120px;margin:auto;padding:0 20px}
.num{direction:ltr;unicode-bidi:isolate;display:inline-block}
/* header */
header{position:sticky;top:0;z-index:20;background:var(--card);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:20px;height:60px}
.logo{display:flex;align-items:center;gap:9px;font-weight:700;font-size:17px}
.logo i{width:30px;height:30px;border-radius:7px 7px 7px 2px;background:var(--pcb);display:grid;place-items:center}
.logo svg{width:18px;height:18px}
nav{display:flex;gap:4px;margin-inline-start:6px}
nav a{padding:6px 12px;border-radius:8px;color:var(--mute);font-weight:500;font-size:14px}
nav a:hover,nav a.on{background:var(--soft);color:var(--ink)}
.sp{flex:1}
.btn{border:0;border-radius:9px;padding:9px 18px;font-weight:600;cursor:pointer;background:var(--blue);color:var(--blue-ink)}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
.btn.big{padding:13px 22px;width:100%;font-size:16px}
.btn:disabled{opacity:.5;cursor:default}
/* hero */
.hero{background:var(--pcb);color:#e8f5f0;position:relative;overflow:hidden}
.hero svg.traces{position:absolute;inset:0;width:100%;height:100%;opacity:.35}
.hero .wrap{position:relative;padding-top:56px;padding-bottom:64px}
.hero h1{font-size:clamp(28px,5vw,46px);line-height:1.35;margin:0 0 10px;max-width:640px;font-weight:700}
.hero p{margin:0 0 26px;color:#b4d3c8;max-width:520px}
.finder{position:relative;max-width:640px}
.finder input{width:100%;border:0;border-radius:12px;padding:16px 52px 16px 16px;font-size:17px;background:#fff;color:#0f1b26}
.finder svg{position:absolute;inset-inline-start:auto;right:16px;top:18px;width:20px;height:20px}
.sugg{position:absolute;top:calc(100% + 6px);inset-inline:0;background:var(--card);color:var(--ink);border-radius:12px;box-shadow:0 14px 34px #0005;overflow:hidden;z-index:5}
.sugg a{display:flex;gap:12px;align-items:center;padding:10px 14px}
.sugg a:hover,.sugg a:focus{background:var(--soft)}
.sugg .t{width:44px;height:34px;border-radius:5px;overflow:hidden;flex:none}
.sugg .t svg{width:100%;height:100%;display:block}
.sugg b{font-weight:600;display:block;line-height:1.3}.sugg small{color:var(--mute)}
.sugg .none{padding:14px;color:var(--mute)}
.redeem{display:inline-flex;gap:10px;align-items:center;margin-top:18px;background:#ffffff14;border:1px dashed #6fb09d;border-radius:10px;padding:8px 8px 8px 14px;font-size:14px}
.redeem input{background:transparent;border:0;border-bottom:1px solid #6fb09d;color:#fff;width:150px;padding:2px 4px;direction:ltr;text-align:left;letter-spacing:.08em}
.redeem input::placeholder{color:#7fb4a4}
.redeem button{background:var(--amber);color:#201400;border:0;border-radius:7px;padding:6px 14px;font-weight:700;cursor:pointer}
/* sections */
main{padding:34px 0 60px}
h2{font-size:21px;margin:0 0 4px}.sub{color:var(--mute);margin:0 0 18px;font-size:14px}
.head{display:flex;justify-content:space-between;align-items:end;margin:38px 0 14px;gap:12px;flex-wrap:wrap}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:5px 15px;cursor:pointer;font-size:14px}
.chip[aria-pressed=true]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;transition:border-color .15s}
.card:hover{border-color:var(--blue)}
.card .th{aspect-ratio:16/10;position:relative}.card .th svg{width:100%;height:100%;display:block}
.wm{position:absolute;inset:0;display:grid;place-items:center;font-weight:700;font-size:26px;color:#ffffff30;transform:rotate(-14deg);pointer-events:none;letter-spacing:.2em}
.card .bd{padding:13px 15px 15px;display:flex;flex-direction:column;gap:5px;flex:1}
.card h3{font-size:15px;margin:0;line-height:1.5;font-weight:600}
.meta{display:flex;justify-content:space-between;color:var(--mute);font-size:13px}
.price{margin-top:auto;padding-top:8px;font-weight:700;font-size:17px;display:flex;justify-content:space-between;align-items:baseline}
.price small{font-weight:400;color:var(--mute);font-size:12px}
.stars{color:var(--amber);letter-spacing:1px}
.tag{font-size:12px;background:var(--soft);padding:1px 9px;border-radius:99px;align-self:flex-start}
.cats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.cat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;text-align:start}
.cat:hover{border-color:var(--blue)}.cat span{color:var(--mute);font-size:13px}
.empty{grid-column:1/-1;background:var(--card);border:1px dashed var(--line);border-radius:12px;padding:28px;text-align:center;color:var(--mute)}
/* how */
.how{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:0;background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;counter-reset:s}
.how div{padding:18px;border-inline-start:1px solid var(--line);counter-increment:s}
.how div:first-child{border-inline-start:0}
.how div:before{content:counter(s);display:grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--green);color:var(--paper);font-weight:700;font-size:13px;margin-bottom:8px}
.how b{display:block}.how span{color:var(--mute);font-size:13.5px}
/* product */
.crumb{font-size:13px;color:var(--mute);margin-bottom:14px}.crumb a:hover{color:var(--blue)}
.pg{display:grid;grid-template-columns:1fr 340px;gap:26px;align-items:start}
.pv{border-radius:16px;overflow:hidden;position:relative;aspect-ratio:16/10;background:var(--pcb)}.pv svg{width:100%;height:100%;display:block}
.pv .wm{font-size:48px}
.pv .note{position:absolute;bottom:10px;inset-inline-start:10px;background:#000a;color:#fff;font-size:12px;border-radius:6px;padding:2px 10px}
.pg h1{font-size:26px;line-height:1.4;margin:18px 0 6px}
.by{color:var(--mute);display:flex;gap:14px;flex-wrap:wrap;align-items:center;font-size:14px}
.pg p.d{max-width:68ch}
.box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px}
.side{position:sticky;top:78px;display:flex;flex-direction:column;gap:14px}
.big-price{font-size:30px;font-weight:700;line-height:1.2}
.pay{font-size:13px;color:var(--mute);margin:2px 0 14px;display:flex;gap:6px;align-items:center}
label{display:block;font-size:13px;font-weight:500;margin:10px 0 3px}
.in{width:100%;border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:9px 11px}
.in.bad{border-color:#d33}.err{color:#d33;font-size:12.5px;min-height:18px}
.files{width:100%;border-collapse:collapse;font-size:14px}
.files td{padding:8px 4px;border-bottom:1px solid var(--line)}.files td:last-child{text-align:left;color:var(--mute)}
.ext{font:600 11px/1 monospace;background:var(--soft);border-radius:4px;padding:3px 6px;margin-inline-end:8px;direction:ltr;display:inline-block}
.rev{padding:14px 0;border-bottom:1px solid var(--line)}.rev:last-child{border:0}
.rev p{margin:4px 0 0}
.done{background:var(--soft);border-radius:10px;padding:14px;margin-top:4px}
.done code{background:var(--card);padding:2px 8px;border-radius:6px;direction:ltr;display:inline-block;font-weight:700}
.vf{color:var(--green);font-weight:700;font-size:13px}.lnk{text-decoration:underline;text-underline-offset:3px}.lnk:hover{color:var(--blue)}
.gal{display:flex;gap:10px;margin-top:10px}.gal button{width:92px;aspect-ratio:16/10;border-radius:9px;overflow:hidden;border:2px solid var(--line);padding:0;cursor:pointer;background:none}.gal button[aria-pressed=true]{border-color:var(--blue)}.gal svg{width:100%;height:100%;display:block}
.av{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:20px;color:#fff;flex:none}
.sh{display:flex;gap:18px;align-items:center;flex-wrap:wrap}.sh h1{margin:0}
.ss{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin:18px 0}
.ss div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}.ss b{font-size:21px;display:block;line-height:1.3}.ss span{color:var(--mute);font-size:13px}
.dist{display:grid;gap:5px;font-size:13px}.dist div{display:grid;grid-template-columns:34px 1fr 38px;gap:8px;align-items:center}.dist i{height:8px;background:var(--soft);border-radius:99px;overflow:hidden;display:block}.dist i b{display:block;height:100%;background:var(--amber)}
.tr{display:grid;gap:8px;font-size:13.5px;color:var(--mute)}.tr span:before{content:&quot;✓&quot;;color:var(--green);font-weight:700;margin-inline-end:8px}
main.wrap{padding-top:26px;padding-bottom:60px}
.card{position:relative}.cl{display:flex;flex-direction:column;flex:1;color:inherit}
.fav{position:absolute;top:8px;inset-inline-start:8px;z-index:2;width:34px;height:34px;border:0;border-radius:50%;background:#000b;color:#fff;font-size:17px;cursor:pointer;line-height:1}.fav[aria-pressed=true]{color:#ff7b9d}
.bw{display:grid;grid-template-columns:250px 1fr;gap:24px;align-items:start}
.fl details&gt;summary{display:none;cursor:pointer;font-weight:600;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 14px;margin-bottom:8px}
.fbox{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:grid;gap:7px;align-content:start;position:sticky;top:76px}
.fbox&gt;b{margin-top:8px;font-size:14px}.fbox&gt;b:first-child{margin-top:0}
.ck{display:flex;align-items:center;gap:8px;font-size:14px;cursor:pointer}.ck .num{margin-inline-start:auto}.ck input{accent-color:var(--blue)}
.pr{display:grid;grid-template-columns:1fr 1fr;gap:8px}.qp{display:flex;gap:6px;flex-wrap:wrap}
.in{width:100%;border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:8px 11px}
.rb{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}.rb .in{padding:5px 10px}
.mute{color:var(--mute);font-size:13.5px}.chip.x{background:var(--soft)}
.pgn{display:flex;gap:6px;justify-content:center;margin-top:24px;flex-wrap:wrap}.pgn .chip{min-width:38px}.pgn .chip:disabled{opacity:.4;cursor:default}
.sugg .all{width:100%;border:0;background:var(--soft);padding:10px;cursor:pointer;font-weight:600}
@media(max-width:820px){.bw{grid-template-columns:1fr}.fl details&gt;summary{display:block}.fbox{position:static}.bar .btn.ghost.hb{display:inline-block}.bar .btn:not(.ghost){display:none}}
.bar .btn{white-space:nowrap}
.toast{position:fixed;bottom:18px;left:50%;transform:translate(-50%,30px);background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:10px;opacity:0;pointer-events:none;transition:.2s;z-index:50}
.toast.on{opacity:1;transform:translate(-50%,0)}
footer{border-top:1px solid var(--line);padding:22px 0;color:var(--mute);font-size:13px}
@media(max-width:820px){nav{display:none}.pg{grid-template-columns:1fr}.side{position:static}.bar .btn.ghost{display:none}.how div{border-inline-start:0;border-top:1px solid var(--line)}.how div:first-child{border-top:0}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}

const P=[
 {id:1,t:&#x27;لوحة ESP32 للتحكم المنزلي&#x27;,c:0,k:&#x27;pcb&#x27;,p:450,r:4.8,n:23,s:&#x27;م. هدى سمير&#x27;,f:[[&#x27;gerber&#x27;,&#x27;Gerber + Drill&#x27;,&#x27;4.2 MB&#x27;],[&#x27;kicad&#x27;,&#x27;مشروع KiCad 8&#x27;,&#x27;1.1 MB&#x27;],[&#x27;pdf&#x27;,&#x27;مخطط الدائرة&#x27;,&#x27;640 KB&#x27;]],d:&#x27;تصميم لوحة من طبقتين لمتحكم ESP32 مع مرحلات، ومنظّم جهد، ومنفذ برمجة. ملفات الإنتاج جاهزة للطلب من أي مصنع.&#x27;},

.badge{font-size:12.5px;font-weight:600;padding:1px 10px;border-radius:99px;white-space:nowrap}
.b-g{background:var(--gbg);color:var(--green)}.b-a{background:var(--abg);color:var(--amber)}.b-r{background:var(--rbg);color:var(--red)}.b-b{background:var(--bbg);color:var(--blue)}.b-n{background:var(--soft);color:var(--mute)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.stat .v{font-size:28px;font-weight:700;line-height:1.2}.stat span{color:var(--mute);font-size:13.5px}
.todo{border-color:var(--green);background:linear-gradient(var(--gbg),var(--gbg)) padding-box;display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-top:14px}
.todo b{font-size:16px}.todo small{display:block;color:var(--mute)}
.cd{font-weight:700;direction:ltr;unicode-bidi:isolate;display:inline-block;font-variant-numeric:tabular-nums}
.cd.low{color:var(--red)}
.row{display:flex;gap:14px;align-items:center;justify-content:space-between;padding:13px 4px;border-bottom:1px solid var(--line);cursor:pointer;flex-wrap:wrap}
.row:last-child{border:0}.row:hover{background:var(--soft)}
.row small{color:var(--mute);display:block}
.code{font:600 16px monospace;direction:ltr;display:inline-block;letter-spacing:.06em}
.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.cc{display:flex;flex-direction:column;gap:6px}
.cc .top{display:flex;justify-content:space-between;align-items:center}
.cc .act{margin-top:6px;display:flex;gap:8px;align-items:center;justify-content:space-between}
.redeem{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.redeem input{flex:1;min-width:180px;border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:9px 12px;direction:ltr;text-align:left;letter-spacing:.08em}
.hint{font-size:13px;color:var(--mute);margin:6px 0 0}.err{color:var(--red);font-size:13px;margin:6px 0 0;min-height:19px}
.tl{list-style:none;padding:0;margin:0;position:relative}
.tl li{padding:0 28px 18px 0;position:relative;color:var(--mute)}
.tl li:before{content:&quot;&quot;;position:absolute;right:6px;top:6px;width:12px;height:12px;border-radius:50%;background:var(--line)}
.tl li:after{content:&quot;&quot;;position:absolute;right:11px;top:20px;bottom:-4px;width:2px;background:var(--line)}
.tl li:last-child:after{display:none}
.tl li.ok{color:var(--ink)}.tl li.ok:before,.tl li.ok:after{background:var(--green)}
.tl li.now:before{background:var(--blue);box-shadow:0 0 0 4px var(--bbg)}.tl li.now{color:var(--ink);font-weight:600}
.dots{display:flex;gap:8px;margin:6px 0}
.dots i{width:30px;height:30px;border-radius:50%;border:2px solid var(--green);display:grid;place-items:center;font-style:normal;font-size:13px;color:var(--green);font-weight:700}
.dots i.used{background:var(--line);border-color:var(--line);color:var(--mute)}.dots i.bad{border-color:var(--red);color:var(--red);background:var(--rbg)}
.prog{height:10px;background:var(--soft);border-radius:99px;overflow:hidden;margin:12px 0 6px}.prog div{height:100%;width:0;background:var(--blue);transition:width .2s}
.prog.fail div{background:var(--red)}
.file{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}.file:last-child{border:0}
.file span:last-child{color:var(--mute)}
.ntf{display:flex;gap:12px;padding:13px 4px;border-bottom:1px solid var(--line)}.ntf:last-child{border:0}
.ntf .dot{width:9px;height:9px;border-radius:50%;background:var(--blue);margin-top:9px;flex:none}.ntf .dot.rd{background:transparent;border:1px solid var(--line)}
.ntf p{margin:0;color:var(--mute);font-size:14px}.ntf small{color:var(--mute)}
.f label{display:block;font-size:13px;font-weight:500;margin:10px 0 3px}.f input{width:100%;max-width:380px;border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:9px 11px}
.crumb{font-size:13px;color:var(--mute);margin-bottom:12px}.crumb a:hover{color:var(--blue)}
.toast{position:fixed;bottom:18px;left:50%;transform:translate(-50%,30px);background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:10px;opacity:0;pointer-events:none;transition:.2s;z-index:50}.toast.on{opacity:1;transform:translate(-50%,0)}
.empty{text-align:center;color:var(--mute);padding:26px}
@media(max-width:820px){.shell{grid-template-columns:1fr}aside nav{position:static;flex-direction:row;overflow-x:auto;gap:6px}aside a{white-space:nowrap;gap:8px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}

:focus-visible{outline:3px solid var(--blue);outline-offset:2px;border-radius:6px}

header{background:var(--pcb);color:#e8f5f0;position:sticky;top:0;z-index:20}
.bar{padding:0 20px;height:56px;display:flex;align-items:center;gap:14px}
.logo{font-weight:700;font-size:17px}.logo small{font-weight:500;color:#9ccbbd;font-size:13px;margin-inline-start:10px;border-inline-start:1px solid #3d7a6a;padding-inline-start:10px}
.sp{flex:1}.bar select{background:#ffffff18;border:1px solid #3d7a6a;color:#fff;border-radius:8px;padding:5px 10px}.bar option{color:#000}
.shell{display:grid;grid-template-columns:230px 1fr;min-height:calc(100vh - 56px)}
aside{background:var(--card);border-inline-end:1px solid var(--line);padding:14px 12px}
aside nav{position:sticky;top:70px;max-height:calc(100vh - 80px);overflow:auto}
aside p{font-size:12px;color:var(--mute);margin:14px 8px 4px;font-weight:600}aside p:first-child{margin-top:0}
aside a{display:flex;justify-content:space-between;padding:6px 10px;border-radius:8px;color:var(--mute);font-weight:500;font-size:14px}
aside a:hover{background:var(--soft);color:var(--ink)}aside a.on{background:var(--ink);color:var(--paper)}
aside a i{font-style:normal;background:var(--red);color:#fff;border-radius:99px;font-size:11px;min-width:19px;text-align:center;padding:0 5px}
main{padding:24px 28px 60px;min-width:0}
h1{font-size:22px;margin:0 0 2px}.sub{color:var(--mute);margin:0 0 16px}
h2{font-size:16px;margin:22px 0 10px}
.vh{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.box{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.btn{border:0;border-radius:8px;padding:7px 15px;font-weight:600;cursor:pointer;background:var(--blue);color:var(--blue-ink)}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}.btn.danger{background:var(--red);color:#fff}
.btn.sm{padding:3px 10px;font-size:13px}.btn:disabled{opacity:.45;cursor:default}
.badge{font-size:12px;font-weight:600;padding:1px 9px;border-radius:99px;white-space:nowrap}
.g{background:var(--gbg);color:var(--green)}.a{background:var(--abg);color:var(--amber)}.r{background:var(--rbg);color:var(--red)}.b{background:var(--bbg);color:var(--blue)}.n{background:var(--soft);color:var(--mute)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:2px 13px;cursor:pointer;font-size:13px}
.chip[aria-pressed=true]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.tw{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:12px}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:start;font-weight:600;color:var(--mute);font-size:12.5px;padding:10px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 14px;border-bottom:1px solid var(--line);vertical-align:middle}tr:last-child td{border:0}
td.ac{white-space:nowrap;text-align:end}td.ac .btn{margin-inline-start:5px}
.empty{padding:28px;text-align:center;color:var(--mute)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
a.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:13px 15px;display:block}
a.stat:hover{border-color:var(--blue)}.stat .v{font-size:27px;font-weight:700;line-height:1.3}.stat span{color:var(--mute);font-size:13px}
.stat.z .v{color:var(--mute)}.stat:not(.z) .v{color:var(--amber)}
.mute{color:var(--mute);font-size:13px}.note{background:var(--abg);border:1px solid var(--amber);border-radius:10px;padding:9px 14px;margin-bottom:14px;font-size:13.5px}
.f label{display:block;font-size:13px;font-weight:500;margin:10px 0 3px}
.in{width:100%;border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:8px 11px}.in.bad{border-color:var(--red)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:14px}
.tabs button{background:none;border:0;padding:8px 14px;cursor:pointer;color:var(--mute);border-bottom:2px solid transparent;font-weight:500}
.tabs button[aria-selected=true]{color:var(--ink);border-color:var(--blue)}
.sw{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.sw input[type=checkbox]{width:38px;height:22px;accent-color:var(--green)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ov{position:fixed;inset:0;background:#0009;display:grid;place-items:center;z-index:40;padding:16px}
.md{background:var(--card);border-radius:14px;padding:20px;width:min(440px,100%)}.md h3{margin:0 0 6px}.md p{margin:0 0 10px;color:var(--mute)}
.md .vh{margin-top:14px;justify-content:flex-start}.err{color:var(--red);font-size:13px;min-height:18px}
.toast{position:fixed;bottom:18px;left:50%;transform:translate(-50%,30px);background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:10px;opacity:0;pointer-events:none;transition:.2s;z-index:60}.toast.on{opacity:1;transform:translate(-50%,0)}

<script>

function show(r){if(!R.includes(r))r='visitor';
