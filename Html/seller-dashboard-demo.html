<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>لوحة البائع — عرض تصميم</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<style>
:root{--paper:#f3f5f7;--card:#fff;--ink:#0f1b26;--mute:#5d6b78;--line:#d8dee4;--blue:#1457d9;--blue-ink:#fff;--green:#17855b;--amber:#b87800;--red:#c93030;--soft:#e9eef5;--pcb:#0d3b32;--gbg:#dff3ea;--abg:#fbefd2;--rbg:#fbe3e3;--bbg:#dfe9fc;color-scheme:light}
@media(prefers-color-scheme:dark){:root{--paper:#0c1219;--card:#141d27;--ink:#e8eef4;--mute:#92a1af;--line:#26323f;--blue:#6f9bff;--blue-ink:#0c1219;--green:#4cc796;--amber:#f0b73a;--red:#ff7b7b;--soft:#1b2733;--pcb:#0a2a24;--gbg:#12372b;--abg:#3a2d0c;--rbg:#3d1a1a;--bbg:#18284a;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:400 15px/1.7 "IBM Plex Sans Arabic",Tahoma,"Segoe UI",sans-serif}
button,input,select,textarea{font:inherit;color:inherit}a{color:inherit;text-decoration:none}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px;border-radius:6px}
.num{direction:ltr;unicode-bidi:isolate;display:inline-block}
header{background:var(--pcb);color:#e8f5f0;position:sticky;top:0;z-index:20}
.bar{max-width:1180px;margin:auto;padding:0 20px;height:58px;display:flex;align-items:center;gap:14px}
.logo{display:flex;align-items:center;gap:9px;font-weight:700;font-size:17px}
.logo small{font-weight:500;color:#9ccbbd;font-size:13px;border-inline-start:1px solid #3d7a6a;padding-inline-start:10px}
.sp{flex:1}.who{font-size:14px;color:#b4d3c8}
.shell{max-width:1180px;margin:auto;padding:24px 20px 60px;display:grid;grid-template-columns:200px 1fr;gap:26px}
aside nav{position:sticky;top:80px;display:flex;flex-direction:column;gap:2px}
aside a{padding:9px 13px;border-radius:9px;color:var(--mute);font-weight:500;display:flex;justify-content:space-between}
aside a:hover{background:var(--soft);color:var(--ink)}aside a.on{background:var(--ink);color:var(--paper)}
aside a i{font-style:normal;background:var(--amber);color:#fff;border-radius:99px;font-size:11px;min-width:19px;text-align:center;padding:0 5px}
h1{font-size:23px;margin:0 0 4px}.sub{color:var(--mute);margin:0 0 18px}
h2{font-size:17px;margin:24px 0 10px}
.box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px}
.btn{border:0;border-radius:9px;padding:8px 16px;font-weight:600;cursor:pointer;background:var(--blue);color:var(--blue-ink)}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}.btn:disabled{opacity:.45;cursor:default}
.btn.sm{padding:4px 11px;font-size:13px}
.badge{font-size:12.5px;font-weight:600;padding:1px 10px;border-radius:99px;white-space:nowrap}
.b-g{background:var(--gbg);color:var(--green)}.b-a{background:var(--abg);color:var(--amber)}.b-r{background:var(--rbg);color:var(--red)}.b-b{background:var(--bbg);color:var(--blue)}.b-n{background:var(--soft);color:var(--mute)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.stat .v{font-size:26px;font-weight:700;line-height:1.3}.stat span{color:var(--mute);font-size:13.5px}
.alert{display:flex;gap:12px;justify-content:space-between;align-items:center;flex-wrap:wrap;background:var(--abg);border:1px solid var(--amber);border-radius:12px;padding:12px 16px;margin-top:12px}
.row{display:flex;gap:14px;align-items:center;justify-content:space-between;padding:12px 4px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.row:last-child{border:0}a.row:hover{background:var(--soft)}
.row small,.mute{color:var(--mute);font-size:13.5px;display:block}
.ext{font:600 11px/1 monospace;background:var(--soft);border-radius:4px;padding:3px 6px;margin-inline-end:8px;direction:ltr;display:inline-block}
.q{height:8px;background:var(--soft);border-radius:99px;overflow:hidden;margin:6px 0 2px}.q div{height:100%;background:var(--green)}.q.hi div{background:var(--red)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.f label{display:block;font-size:13px;font-weight:500;margin:10px 0 3px}
.in{width:100%;border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:9px 11px}.in.bad{border-color:var(--red)}
.err{color:var(--red);font-size:13px;min-height:19px;margin:6px 0 0}
.drop{border:2px dashed var(--line);border-radius:12px;padding:22px;text-align:center;background:var(--paper)}
.prog{height:10px;background:var(--soft);border-radius:99px;overflow:hidden;margin:12px 0 4px}.prog div{height:100%;width:0;background:var(--blue);transition:width .15s}
.vh{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.crumb{font-size:13px;color:var(--mute);margin-bottom:12px}.crumb a:hover{color:var(--blue)}
.toast{position:fixed;bottom:18px;left:50%;transform:translate(-50%,30px);background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:10px;opacity:0;pointer-events:none;transition:.2s;z-index:50}.toast.on{opacity:1;transform:translate(-50%,0)}
@media(max-width:820px){.shell{grid-template-columns:1fr}aside nav{position:static;flex-direction:row;overflow-x:auto;gap:6px}aside a{white-space:nowrap;gap:8px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header><div class="bar"><span class="logo">إلكترونيات<small>لوحة البائع</small></span><span class="sp"></span><span class="who">م. هدى سمير</span></div></header>
<div class="shell"><aside><nav id="nav"></nav></aside><main id="v"></main></div>
<div class="toast" id="toast" role="status"></div>
<script>
const $=s=>document.querySelector(s),now=Date.now(),H=36e5;
const CATS=['لوحات PCB','\u00a0\u00a0└ لوحات متحكمات','\u00a0\u00a0└ مصادر تغذية','برمجيات مدمجة','مكتبات','نماذج ثلاثية الأبعاد'];
const OK=['gerber','zip','pdf','kicad','kicad_pro','stl','step','mp4','c','ioc','md','lib'];
const S={
 drives:[{id:1,email:'hoda.pcb@gmail.com',used:12.4,tot:15,def:true},{id:2,email:'hoda.backup@gmail.com',used:3.1,tot:15,def:false}],
 files:[
  {id:1,n:'esp32-board.gerber',kb:4300,st:'clean',d:1},{id:2,n:'esp32-board.kicad',kb:1100,st:'clean',d:1},{id:3,n:'esp32-schematic.pdf',kb:640,st:'clean',d:1},
  {id:4,n:'psu-5v3a.gerber',kb:2900,st:'scan',d:1,at:now+9e3},{id:5,n:'psu-calc.pdf',kb:410,st:'clean',d:2},{id:6,n:'old-sample.zip',kb:8800,st:'quar',d:1}],
 products:[
  {id:1,t:'لوحة ESP32 للتحكم المنزلي',st:'published',price:450,cat:1,desc:'تصميم لوحة من طبقتين لمتحكم ESP32 مع مرحلات ومنظّم جهد.',sales:23,
   v:[{n:2,st:'published',f:[1,2,3]},{n:1,st:'archived',f:[1,3]}]},
  {id:2,t:'مصدر تغذية 5V / 3A',st:'draft',price:300,cat:2,desc:'مصدر تبديل صغير بكفاءة عالية مع حسابات المكوّنات.',sales:0,v:[{n:1,st:'draft',f:[4,5]}]},
  {id:3,t:'مضخم صوت Class-D',st:'paused',price:520,cat:0,desc:'مضخم ستيريو 2×25W بتشويه منخفض.',sales:9,v:[{n:1,st:'published',f:[]}]}],
 wallet:{avail:1840,held:360,paid:4200},
 pay:[{amt:1500,st:'paid',at:now-30*24*H},{amt:2700,st:'paid',at:now-60*24*H},{amt:800,st:'rejected',why:'بيانات الحساب البنكي غير مكتملة',at:now-12*24*H}],
 notes:[{t:'اعتُمد طلب السحب بقيمة 1,500 ج.م',at:now-30*24*H},{t:'ملف old-sample.zip نُقل إلى العزل',d:'اكتُشف فيه محتوى غير مسموح. تواصل مع الإدارة لمراجعته.',at:now-3*24*H}],
 sales:[['م.ع.','لوحة ESP32 للتحكم المنزلي',450,'مكتمل',now-5*H],['أ.ط.','لوحة ESP32 للتحكم المنزلي',450,'بانتظار تأكيد التسليم',now-26*H],['ي.ح.','مضخم صوت Class-D',520,'مكتمل',now-4*24*H]]};
const ST={published:['b-g','منشور'],draft:['b-n','مسودة'],paused:['b-a','موقوف'],archived:['b-n','مؤرشف']};
const FS={clean:['b-g','سليم'],scan:['b-a','قيد الفحص'],quar:['b-r','معزول']};
const PS={paid:['b-g','تم الصرف'],pending:['b-a','قيد المراجعة'],rejected:['b-r','مرفوض']};
const bd=(m,k)=>`<span class="badge ${m[k][0]}">${m[k][1]}</span>`;
const sz=kb=>kb>=1024?(kb/1024).toFixed(1)+' MB':kb+' KB';
const money=n=>`<span class="num">${n.toLocaleString('en')}</span> ج.م`;
const rel=t=>{const h=Math.round((now-t)/H);return h<1?'قبل دقائق':h<24?`قبل ${h} ساعة`:`قبل ${Math.round(h/24)} يومًا`};
const ext=n=>n.split('.').pop().toLowerCase();
const file=id=>S.files.find(f=>f.id===id);
const fr=f=>`<div class="row"><div><span class="ext">${ext(f.n)}</span>${f.n}<small>${sz(f.kb)} — ${S.drives.find(d=>d.id===f.d).email}</small></div>${bd(FS,f.st)}</div>`;
const scanning=()=>S.files.filter(f=>f.st==='scan').length;
const NAV=[['overview','لوحة التحكم'],['products','منتجاتي'],['files','مكتبة الملفات'],['upload','رفع ملف جديد'],['drives','حسابات Drive'],['wallet','المحفظة والمستحقات'],['notifications','الإشعارات']];
function nav(cur){$('#nav').innerHTML=NAV.map(([k,l])=>`<a href="#/${k}" class="${cur===k?'on':''}">${l}${k==='files'&&scanning()?`<i>${scanning()}</i>`:''}</a>`).join('')}
const quota=d=>{const p=Math.round(d.used/d.tot*100);return `<div class="q ${p>80?'hi':''}"><div style="width:${p}%"></div></div><span class="mute"><span class="num">${d.used}</span> من <span class="num">${d.tot}</span> GB — متبقي <span class="num">${(d.tot-d.used).toFixed(1)}</span> GB</span>`};
const V={
 overview(){const low=S.drives.find(d=>d.used/d.tot>.8);return `<h1>مرحبًا، هدى</h1><p class="sub">هذا ملخص نشاطك كبائعة.</p>
 <div class="stats"><div class="stat"><div class="v">${money(S.wallet.avail)}</div><span>رصيد متاح للسحب</span></div><div class="stat"><div class="v">${money(S.wallet.held)}</div><span>معلّق لحين تأكيد التسليم</span></div><div class="stat"><div class="v">${S.products.filter(p=>p.st==='published').length}</div><span>منتج منشور</span></div><div class="stat"><div class="v">${scanning()}</div><span>ملف قيد الفحص</span></div></div>
 ${low?`<div class="alert"><span><b>مساحة ${low.email} شبه ممتلئة.</b> متبقي <span class="num">${(low.tot-low.used).toFixed(1)}</span> GB فقط.</span><a class="btn ghost sm" href="#/drives">أدر الحسابات</a></div>`:''}
 <h2>آخر المبيعات</h2><div class="box" style="padding:6px 14px">${S.sales.map(s=>`<div class="row"><div><b>${s[1]}</b><small>المشتري ${s[0]} — ${rel(s[4])}</small></div><span style="text-align:end">${money(s[2])}<small>${s[3]}</small></span></div>`).join('')}</div>`},
 products(){return `<div class="vh"><div><h1>منتجاتي</h1><p class="sub">أدر إصدارات ملفاتك ونشرها.</p></div><button class="btn" onclick="newProd()">منتج جديد</button></div><div class="box" style="padding:6px 14px">${S.products.map(p=>`<a class="row" href="#/products/${p.id}"><div><b>${p.t}</b><small>${CATS[p.cat].replace(/[\u00a0└]/g,'').trim()} — ${p.v.length} إصدارات — ${p.sales} مبيعات</small></div><span style="text-align:end">${money(p.price)} ${bd(ST,p.st)}</span></a>`).join('')}</div>`},
 product(id){const p=S.products.find(x=>x.id===id);if(!p)return V.products();
  const free=S.files.filter(f=>f.st==='clean'&&!S.products.some(q=>q.v.some(v=>v.f.includes(f.id))));
  return `<div class="crumb"><a href="#/products">منتجاتي</a> / ${p.t}</div><div class="vh"><h1>${p.t}</h1>${bd(ST,p.st)}</div>
  <form class="f box" onsubmit="event.preventDefault();saveProd(${p.id})"><label for="pt">اسم المنتج</label><input class="in" id="pt" value="${p.t}">
  <div class="grid2" style="grid-template-columns:1fr 1fr"><div><label for="pp">السعر (ج.م)</label><input class="in" id="pp" type="number" min="1" value="${p.price}" dir="ltr"></div><div><label for="pc">التصنيف</label><select class="in" id="pc">${CATS.map((c,i)=>`<option value="${i}" ${i===p.cat?'selected':''}>${c}</option>`).join('')}</select></div></div>
  <label for="pd">الوصف</label><textarea class="in" id="pd" rows="3">${p.desc}</textarea><div class="err" id="pe"></div>
  <div class="vh"><button class="btn">احفظ التغييرات</button>${p.st==='published'?`<button type="button" class="btn ghost" onclick="setSt(${p.id},'paused')">أوقف النشر</button>`:p.st==='paused'?`<button type="button" class="btn ghost" onclick="setSt(${p.id},'published')">أعد النشر</button>`:''}</div></form>
  <h2>الإصدارات</h2>${p.v.map(v=>{const fs=v.f.map(file),bad=fs.filter(f=>f.st!=='clean').length;
   return `<div class="box" style="margin-bottom:12px"><div class="vh"><b>الإصدار <span class="num">${v.n}</span> ${bd(ST,v.st)}</b>${v.st==='draft'?`<button class="btn sm" ${!fs.length||bad?'disabled':''} onclick="pubV(${p.id},${v.n})">انشر الإصدار</button>`:''}</div>
   ${fs.length?fs.map(fr).join(''):'<p class="mute" style="margin:10px 0 0">لا توجد ملفات في هذا الإصدار بعد.</p>'}
   ${v.st==='draft'&&bad?`<p class="mute" style="color:var(--amber)">لا يمكن النشر الآن: ${bad} ملف لم يكتمل فحصه أو معزول.</p>`:''}
   ${v.st==='draft'?`<div class="vh" style="margin-top:10px"><select class="in" id="at${v.n}" style="max-width:260px"><option value="">أرفق ملفًا من المكتبة…</option>${free.map(f=>`<option value="${f.id}">${f.n}</option>`).join('')}</select><button class="btn ghost sm" onclick="attach(${p.id},${v.n})">أرفق</button></div>`:''}</div>`}).join('')}
  <button class="btn ghost" onclick="newV(${p.id})">أنشئ إصدارًا جديدًا</button>`},
 files(){return `<div class="vh"><div><h1>مكتبة الملفات</h1><p class="sub">كل ملف يُفحص قبل أن يُسمح بنشره.</p></div><a class="btn" href="#/upload">ارفع ملفًا</a></div><div class="box" style="padding:6px 14px">${S.files.map(fr).join('')}</div>`},
 upload(){return `<h1>رفع ملف جديد</h1><p class="sub">يُرفع الملف مباشرة إلى حساب Drive الخاص بك.</p><div class="box f"><label for="ud">حفظ في حساب</label><select class="in" id="ud" style="max-width:380px">${S.drives.map(d=>`<option value="${d.id}">${d.email} — متبقي ${(d.tot-d.used).toFixed(1)} GB</option>`).join('')}</select>
  <label>الملف</label><div class="drop"><input type="file" id="uf" aria-label="اختر ملفًا"><p class="mute">الأنواع المسموحة: <span class="num">${OK.join(' · ')}</span></p></div>
  <div class="err" id="ue"></div><div class="vh"><button class="btn" id="ub" onclick="upload()">ابدأ الرفع</button><button class="btn ghost" onclick="sample()">جرّب ملفًا تجريبيًا غير مسموح</button></div>
  <div class="prog"><div id="up"></div></div><span class="mute" id="us"></span></div>`},
 drives(){return `<div class="vh"><div><h1>حسابات Drive</h1><p class="sub">ملفاتك تبقى في حساباتك وليس على خوادم المنصة.</p></div><button class="btn" onclick="toast('سيُفتح تسجيل الدخول من Google لربط الحساب')">اربط حسابًا جديدًا</button></div>
  <div class="grid2">${S.drives.map(d=>`<div class="box"><div class="vh"><b dir="ltr">${d.email}</b>${d.def?'<span class="badge b-b">الافتراضي</span>':`<button class="btn ghost sm" onclick="defD(${d.id})">اجعله افتراضيًا</button>`}</div>${quota(d)}</div>`).join('')}</div>`},
 wallet(){const w=S.wallet;return `<h1>المحفظة والمستحقات</h1><p class="sub">المبلغ يصبح متاحًا بعد تأكيد تسليم الكود للمشتري.</p>
  <div class="stats"><div class="stat"><div class="v">${money(w.avail)}</div><span>متاح للسحب</span></div><div class="stat"><div class="v">${money(w.held)}</div><span>معلّق</span></div><div class="stat"><div class="v">${money(w.paid)}</div><span>مجموع ما صُرف</span></div></div>
  <h2>اطلب سحبًا</h2><form class="f box" onsubmit="event.preventDefault();payout()"><label for="pa">المبلغ (ج.م) — الحد الأدنى 200</label><input class="in" id="pa" type="number" dir="ltr" style="max-width:240px"><div class="err" id="pe"></div><button class="btn">أرسل طلب السحب</button></form>
  <h2>سجل الطلبات</h2><div class="box" style="padding:6px 14px">${S.pay.map(p=>`<div class="row"><div>${money(p.amt)}<small>${rel(p.at)}${p.why?' — '+p.why:''}</small></div>${bd(PS,p.st)}</div>`).join('')}</div>`},
 notifications(){return `<h1>الإشعارات</h1><p class="sub">آخر ما يخص منتجاتك وملفاتك.</p><div class="box" style="padding:6px 14px">${S.notes.map(n=>`<div class="row"><div><b>${n.t}</b>${n.d?`<small>${n.d}</small>`:''}</div><small>${rel(n.at)}</small></div>`).join('')}</div>`}
};
function saveProd(id){const p=S.products.find(x=>x.id===id),t=$('#pt').value.trim(),pr=+$('#pp').value;
 if(!t){$('#pt').classList.add('bad');$('#pe').textContent='اكتب اسم المنتج.';return}
 if(!(pr>0)){$('#pp').classList.add('bad');$('#pe').textContent='اكتب سعرًا أكبر من صفر.';return}
 Object.assign(p,{t,price:pr,cat:+$('#pc').value,desc:$('#pd').value});toast('تم حفظ التغييرات');route()}
function setSt(id,s){S.products.find(x=>x.id===id).st=s;toast(s==='paused'?'تم إيقاف النشر':'تمت إعادة النشر');route()}
function pubV(id,n){const p=S.products.find(x=>x.id===id);p.v.forEach(v=>{if(v.st==='published')v.st='archived'});p.v.find(v=>v.n===n).st='published';p.st='published';toast('تم نشر الإصدار');route()}
function attach(id,n){const x=$('#at'+n).value;if(!x)return toast('اختر ملفًا أولًا');S.products.find(p=>p.id===id).v.find(v=>v.n===n).f.push(+x);toast('تم إرفاق الملف');route()}
function newV(id){const p=S.products.find(x=>x.id===id);if(p.v.some(v=>v.st==='draft'))return toast('لديك إصدار مسودة بالفعل');p.v.unshift({n:Math.max(...p.v.map(v=>v.n))+1,st:'draft',f:[]});toast('تم إنشاء إصدار جديد');route()}
function newProd(){const id=S.products.length+1;S.products.push({id,t:'منتج جديد بلا اسم',st:'draft',price:100,cat:0,desc:'',sales:0,v:[{n:1,st:'draft',f:[]}]});location.hash='#/products/'+id}
function defD(id){S.drives.forEach(d=>d.def=d.id===id);toast('تم تغيير الحساب الافتراضي');route()}
function payout(){const a=+$('#pa').value,e=$('#pe');if(!(a>=200)){e.textContent='الحد الأدنى للسحب 200 ج.م.';return}if(a>S.wallet.avail){e.textContent='المبلغ أكبر من رصيدك المتاح.';return}
 S.wallet.avail-=a;S.pay.unshift({amt:a,st:'pending',at:Date.now()});toast('تم إرسال طلب السحب');route()}
function run(name,kb,did){const e=$('#ue'),d=S.drives.find(x=>x.id===did),x=ext(name);e.textContent='';
 if(!OK.includes(x)){e.textContent=`النوع .${x} غير مسموح. ارفع ملفًا من الأنواع المذكورة أعلاه.`;return}
 if(kb/1048576>d.tot-d.used){e.textContent='مساحة الحساب المختار لا تكفي لهذا الملف.';return}
 const b=$('#ub');b.disabled=true;let p=0;const t=setInterval(()=>{p+=8;$('#up').style.width=Math.min(p,100)+'%';$('#us').textContent='جارٍ الرفع… '+Math.min(p,100)+'%';
  if(p>=100){clearInterval(t);S.files.unshift({id:Date.now(),n:name,kb,st:'scan',d:did,at:Date.now()+6e3});$('#us').textContent='اكتمل الرفع. الملف الآن قيد الفحص.';b.disabled=false;nav('upload');toast('تم رفع الملف')}},150)}
function upload(){const f=$('#uf').files[0];if(!f){$('#ue').textContent='اختر ملفًا أولًا.';return}run(f.name,Math.max(1,Math.round(f.size/1024)),+$('#ud').value)}
function sample(){run('setup.exe',2400,+$('#ud').value)}
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove('on'),2600)}
function route(){const [,k='overview',id]=location.hash.split('/');const key=NAV.some(n=>n[0]===k)?k:'overview';
 $('#v').innerHTML=(key==='products'&&id?V.product:V[key])(+id||id);nav(key);window.scrollTo(0,0)}
setInterval(()=>{let ch=false;S.files.forEach(f=>{if(f.st==='scan'&&Date.now()>=f.at){f.st='clean';ch=true}});
 if(ch){toast('انتهى فحص ملف وأصبح سليمًا');const k=location.hash.split('/')[1];if(!['upload','wallet'].includes(k)&&!document.activeElement?.closest?.('form'))route();else nav(k||'overview')}},1000);
addEventListener('hashchange',route);route();
</script>
