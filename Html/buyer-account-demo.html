<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>حسابي — عرض تصميم</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<style>
:root{--paper:#f3f5f7;--card:#fff;--ink:#0f1b26;--mute:#5d6b78;--line:#d8dee4;--blue:#1457d9;--blue-ink:#fff;--green:#17855b;--amber:#b87800;--red:#c93030;--soft:#e9eef5;--pcb:#0d3b32;--gbg:#dff3ea;--abg:#fbefd2;--rbg:#fbe3e3;--bbg:#dfe9fc;color-scheme:light}
@media(prefers-color-scheme:dark){:root{--paper:#0c1219;--card:#141d27;--ink:#e8eef4;--mute:#92a1af;--line:#26323f;--blue:#6f9bff;--blue-ink:#0c1219;--green:#4cc796;--amber:#f0b73a;--red:#ff7b7b;--soft:#1b2733;--pcb:#0a2a24;--gbg:#12372b;--abg:#3a2d0c;--rbg:#3d1a1a;--bbg:#18284a;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:400 15px/1.7 "IBM Plex Sans Arabic",Tahoma,"Segoe UI",sans-serif}
button,input{font:inherit;color:inherit}a{color:inherit;text-decoration:none}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px;border-radius:6px}
.num{direction:ltr;unicode-bidi:isolate;display:inline-block}
header{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.bar{max-width:1120px;margin:auto;padding:0 20px;height:60px;display:flex;align-items:center;gap:16px}
.logo{display:flex;align-items:center;gap:9px;font-weight:700;font-size:17px}
.logo i{width:30px;height:30px;border-radius:7px 7px 7px 2px;background:var(--pcb);display:grid;place-items:center}
.logo svg{width:18px;height:18px}.sp{flex:1}
.bell{position:relative;border:1px solid var(--line);background:transparent;border-radius:9px;width:38px;height:38px;cursor:pointer}
.bell svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:2}
.bell b{position:absolute;top:-6px;inset-inline-start:-6px;background:var(--red);color:#fff;border-radius:99px;min-width:19px;height:19px;font-size:11px;display:grid;place-items:center}
.shell{max-width:1120px;margin:auto;padding:26px 20px 60px;display:grid;grid-template-columns:210px 1fr;gap:26px}
aside nav{position:sticky;top:84px;display:flex;flex-direction:column;gap:2px}
aside a{padding:9px 13px;border-radius:9px;color:var(--mute);font-weight:500;display:flex;justify-content:space-between}
aside a:hover{background:var(--soft);color:var(--ink)}aside a.on{background:var(--ink);color:var(--paper)}
aside a i{font-style:normal;background:var(--red);color:#fff;border-radius:99px;font-size:11px;min-width:19px;text-align:center;padding:0 5px}
h1{font-size:23px;margin:0 0 4px}.sub{color:var(--mute);margin:0 0 20px}
h2{font-size:17px;margin:26px 0 10px}
.box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px}
.btn{border:0;border-radius:9px;padding:8px 16px;font-weight:600;cursor:pointer;background:var(--blue);color:var(--blue-ink)}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
.btn:disabled{opacity:.45;cursor:default}
.badge{font-size:12.5px;font-weight:600;padding:1px 10px;border-radius:99px;white-space:nowrap}
.b-g{background:var(--gbg);color:var(--green)}.b-a{background:var(--abg);color:var(--amber)}.b-r{background:var(--rbg);color:var(--red)}.b-b{background:var(--bbg);color:var(--blue)}.b-n{background:var(--soft);color:var(--mute)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.stat .v{font-size:28px;font-weight:700;line-height:1.2}.stat span{color:var(--mute);font-size:13.5px}
.todo{border-color:var(--green);background:linear-gradient(var(--gbg),var(--gbg)) padding-box;display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-top:14px}
.todo b{font-size:16px}.todo small{display:block;color:var(--mute)}
.cd{font-weight:700;direction:ltr;unicode-bidi:isolate;display:inline-block;font-variant-numeric:tabular-nums}
.cd.low{color:var(--red)}
.row{display:flex;gap:14px;align-items:center;justify-content:space-between;padding:13px 4px;border-bottom:1px solid var(--line);cursor:pointer;flex-wrap:wrap}
.row:last-child{border:0}.row:hover{background:var(--soft)}
.row small{color:var(--mute);display:block}
.code{font:600 16px monospace;direction:ltr;display:inline-block;letter-spacing:.06em}
.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.cc{display:flex;flex-direction:column;gap:6px}
.cc .top{display:flex;justify-content:space-between;align-items:center}
.cc .act{margin-top:6px;display:flex;gap:8px;align-items:center;justify-content:space-between}
.redeem{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.redeem input{flex:1;min-width:180px;border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:9px 12px;direction:ltr;text-align:left;letter-spacing:.08em}
.hint{font-size:13px;color:var(--mute);margin:6px 0 0}.err{color:var(--red);font-size:13px;margin:6px 0 0;min-height:19px}
.tl{list-style:none;padding:0;margin:0;position:relative}
.tl li{padding:0 28px 18px 0;position:relative;color:var(--mute)}
.tl li:before{content:"";position:absolute;right:6px;top:6px;width:12px;height:12px;border-radius:50%;background:var(--line)}
.tl li:after{content:"";position:absolute;right:11px;top:20px;bottom:-4px;width:2px;background:var(--line)}
.tl li:last-child:after{display:none}
.tl li.ok{color:var(--ink)}.tl li.ok:before,.tl li.ok:after{background:var(--green)}
.tl li.now:before{background:var(--blue);box-shadow:0 0 0 4px var(--bbg)}.tl li.now{color:var(--ink);font-weight:600}
.dots{display:flex;gap:8px;margin:6px 0}
.dots i{width:30px;height:30px;border-radius:50%;border:2px solid var(--green);display:grid;place-items:center;font-style:normal;font-size:13px;color:var(--green);font-weight:700}
.dots i.used{background:var(--line);border-color:var(--line);color:var(--mute)}.dots i.bad{border-color:var(--red);color:var(--red);background:var(--rbg)}
.prog{height:10px;background:var(--soft);border-radius:99px;overflow:hidden;margin:12px 0 6px}.prog div{height:100%;width:0;background:var(--blue);transition:width .2s}
.prog.fail div{background:var(--red)}
.file{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}.file:last-child{border:0}
.file span:last-child{color:var(--mute)}
.ntf{display:flex;gap:12px;padding:13px 4px;border-bottom:1px solid var(--line)}.ntf:last-child{border:0}
.ntf .dot{width:9px;height:9px;border-radius:50%;background:var(--blue);margin-top:9px;flex:none}.ntf .dot.rd{background:transparent;border:1px solid var(--line)}
.ntf p{margin:0;color:var(--mute);font-size:14px}.ntf small{color:var(--mute)}
.f label{display:block;font-size:13px;font-weight:500;margin:10px 0 3px}.f input{width:100%;max-width:380px;border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:9px 11px}
.crumb{font-size:13px;color:var(--mute);margin-bottom:12px}.crumb a:hover{color:var(--blue)}
.toast{position:fixed;bottom:18px;left:50%;transform:translate(-50%,30px);background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:10px;opacity:0;pointer-events:none;transition:.2s;z-index:50}.toast.on{opacity:1;transform:translate(-50%,0)}
.empty{text-align:center;color:var(--mute);padding:26px}
@media(max-width:820px){.shell{grid-template-columns:1fr}aside nav{position:static;flex-direction:row;overflow-x:auto;gap:6px}aside a{white-space:nowrap;gap:8px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header><div class="bar"><a class="logo" href="#/overview"><i><svg viewBox="0 0 24 24" fill="none" stroke="#9ce2bf" stroke-width="2"><path d="M3 12h6l2-5 3 10 2-5h5"/></svg></i>إلكترونيات</a><span class="sp"></span>
<span style="color:var(--mute);font-size:14px">منى عبد الله</span>
<button class="bell" aria-label="الإشعارات" onclick="location.hash='#/notifications'"><svg viewBox="0 0 24 24"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 8 3 8H3s3-1 3-8M10 20a2 2 0 0 0 4 0"/></svg><b id="bc"></b></button></div></header>
<div class="shell"><aside><nav id="nav"></nav></aside><main id="v"></main></div>
<div class="toast" id="toast" role="status"></div>
<script>
const $=s=>document.querySelector(s),now=Date.now(),H=36e5;
const S={
 orders:[
  {id:'REQ-7F3A9C',p:'لوحة ESP32 للتحكم المنزلي',amt:450,st:'code',at:now-5*H},
  {id:'REQ-2B81DE',p:'مكتبة رموز وبصمات KiCad',amt:180,st:'review',at:now-2*H},
  {id:'REQ-9C04AF',p:'فيرموير مراقبة الطاقة على STM32',amt:620,st:'done',at:now-9*24*H},
  {id:'REQ-51E7B2',p:'مضخم صوت Class-D',amt:520,st:'rejected',at:now-20*24*H}],
 codes:[
  {pre:'K7QF',p:'لوحة ESP32 للتحكم المنزلي',st:'active',exp:now+46*H+25*6e4,left:3,order:'REQ-7F3A9C'},
  {pre:'M2XD',p:'فيرموير مراقبة الطاقة على STM32',st:'used',exp:now-5*24*H,left:2,order:'REQ-9C04AF'},
  {pre:'T9LB',p:'مصدر تغذية 5V / 3A',st:'expired',exp:now-30*H,left:3,order:'—'}],
 notes:[
  {t:'صدر كود التفعيل لطلبك REQ-7F3A9C',d:'الكود صالح لمدة 48 ساعة. افتح صفحة التنزيل وابدأ.',at:now-4*H,r:false},
  {t:'طلبك REQ-2B81DE قيد المراجعة',d:'ستتواصل معك الإدارة لتأكيد الدفع.',at:now-2*H,r:false},
  {t:'اكتمل تنزيل «فيرموير مراقبة الطاقة»',d:'بقيت لك محاولتان على هذا الكود.',at:now-9*24*H,r:true}],
 comp:false};
const ST={code:['b-g','صدر الكود'],review:['b-a','قيد المراجعة'],done:['b-b','مكتمل'],rejected:['b-r','مرفوض']};
const CS={active:['b-g','فعّال'],used:['b-n','مستخدم'],expired:['b-r','منتهي']};
const rel=t=>{const h=Math.round((now-t)/H);return h<1?'قبل دقائق':h<24?`قبل ${h} ساعة`:`قبل ${Math.round(h/24)} يومًا`};
const cd=e=>{let s=Math.max(0,Math.floor((e-Date.now())/1e3));const h=String(Math.floor(s/3600)).padStart(2,'0'),m=String(Math.floor(s%3600/60)).padStart(2,'0'),x=String(s%60).padStart(2,'0');return `${h}:${m}:${x}`};
const cdEl=e=>`<span class="cd ${e-Date.now()<6*H?'low':''}" data-e="${e}">${cd(e)}</span>`;
const bd=(m,k)=>`<span class="badge ${m[k][0]}">${m[k][1]}</span>`;
const act=()=>S.codes.find(c=>c.st==='active');
const unread=()=>S.notes.filter(n=>!n.r).length;
const NAV=[['overview','نظرة عامة'],['orders','طلباتي'],['codes','أكوادي'],['downloads','التنزيلات'],['notifications','الإشعارات'],['profile','الملف الشخصي']];
function nav(cur){$('#nav').innerHTML=NAV.map(([k,l])=>`<a href="#/${k}" class="${cur===k?'on':''}">${l}${k==='notifications'&&unread()?`<i>${unread()}</i>`:''}</a>`).join('');const b=$('#bc');b.textContent=unread();b.hidden=!unread()}
const V={
 overview(){const a=act();return `<h1>مرحبًا، منى</h1><p class="sub">هذا ملخص طلباتك وأكوادك.</p>
 <div class="stats"><div class="stat"><div class="v">${S.codes.filter(c=>c.st==='active').length}</div><span>كود فعّال</span></div><div class="stat"><div class="v">${a?a.left:0}</div><span>محاولات تنزيل متبقية</span></div><div class="stat"><div class="v">${S.orders.filter(o=>o.st==='review').length}</div><span>طلب قيد المراجعة</span></div></div>
 ${a?`<div class="box todo"><div><b>${a.p}</b><small>كودك فعّال، ينتهي بعد ${cdEl(a.exp)}</small></div><a class="btn" href="#/downloads/${a.pre}">نزّل ملفاتك الآن</a></div>`:''}
 <h2>آخر الطلبات</h2><div class="box" style="padding:6px 14px">${S.orders.slice(0,3).map(orderRow).join('')}</div>`},
 orders(){return `<h1>طلباتي</h1><p class="sub">اضغط على أي طلب لمتابعة مراحله.</p><div class="box" style="padding:6px 14px">${S.orders.map(orderRow).join('')}</div>`},
 order(id){const o=S.orders.find(x=>x.id===id);if(!o)return V.orders();
  const step=['review','code','done'].indexOf(o.st);const rej=o.st==='rejected';
  const L=[['أُرسل الطلب',0],['راجعته الإدارة',1],['صدر كود التفعيل',2],['نزّلت الملفات',3]];
  const done=rej?1:{review:1,code:3,done:4}[o.st];
  return `<div class="crumb"><a href="#/orders">طلباتي</a> / ${o.id}</div><h1>${o.p}</h1><p class="sub"><span class="num">${o.id}</span> — ${bd(ST,o.st)} — <span class="num">${o.amt}</span> ج.م</p>
  <div class="box"><ul class="tl">${L.map(([t,i])=>{const c=i<done?'ok':i===done&&!rej?'now':'';return `<li class="${c}">${t}</li>`}).join('')}${rej?'<li class="now" style="color:var(--red)">رُفض الطلب — لم يتم تأكيد الدفع</li>':''}</ul></div>
  ${o.st==='code'?`<p style="margin-top:14px"><a class="btn" href="#/downloads/K7QF">اذهب إلى التنزيل</a></p>`:''}`},
 codes(){return `<h1>أكوادي</h1><p class="sub">كل كود لمنتج واحد وله مدة صلاحية.</p>
 <div class="box"><b>لديك كود جديد؟</b><div class="redeem" style="margin-top:8px"><input id="ci" placeholder="XXXX-XXXX-XXXX" maxlength="14" aria-label="كود الشراء"><button class="btn" onclick="redeem()">فعّل الكود</button></div><p class="err" id="ce"></p><p class="hint">للتجربة: اكتب K7QF-92XM-4TLP</p></div>
 <h2>أكوادك</h2><div class="grid2">${S.codes.map(c=>`<div class="box cc"><div class="top"><span class="code">${c.pre}-••••</span>${bd(CS,c.st)}</div><b>${c.p}</b><small style="color:var(--mute)">${c.st==='active'?`ينتهي بعد ${cdEl(c.exp)}`:c.st==='used'?'استُخدم لإكمال التنزيل':'انتهت صلاحيته ولم يُستخدم'}</small>
 <div class="act"><span style="color:var(--mute);font-size:13px">الطلب: <span class="num">${c.order}</span></span>${c.st==='active'?`<a class="btn" href="#/downloads/${c.pre}">نزّل</a>`:c.st==='expired'?`<button class="btn ghost" onclick="toast('تم إرسال طلب تمديد الكود إلى الإدارة')">اطلب تمديدًا</button>`:''}</div></div>`).join('')}</div>`},
 downloads(id){const c=S.codes.find(x=>x.pre===id);if(!c)return `<h1>التنزيلات</h1><p class="sub">جلسات التنزيل لأكوادك.</p><div class="box" style="padding:6px 14px">${S.codes.filter(c=>c.st!=='expired').map(c=>`<a class="row" href="#/downloads/${c.pre}"><div><b>${c.p}</b><small>باقي ${c.left} من 3 محاولات</small></div>${bd(CS,c.st)}</a>`).join('')}</div>`;
  const can=c.st==='active'&&c.left>0;
  return `<div class="crumb"><a href="#/downloads">التنزيلات</a> / ${c.p}</div><h1>${c.p}</h1><p class="sub">${can?`ينتهي الكود بعد ${cdEl(c.exp)}`:c.st==='used'?'اكتمل تنزيل هذا المنتج.':'لا يمكن التنزيل بهذا الكود.'}</p>
  <div class="grid2" style="grid-template-columns:repeat(auto-fit,minmax(300px,1fr))"><div class="box"><b>المحاولات</b><div class="dots" id="dots">${[0,1,2].map(i=>`<i class="${i>=c.left?'used':''}">${i+1}</i>`).join('')}</div><p class="hint">المحاولة الفاشلة تظهر هنا، ويمكنك طلب تعويضها.</p>
  <div class="prog" id="pg"><div></div></div><div id="ps" class="hint">${can?'جاهز للتنزيل.':''}</div>
  <p style="margin:12px 0 0;display:flex;gap:10px;align-items:center;flex-wrap:wrap"><button class="btn" id="go" ${can?'':'disabled'} onclick="dl('${c.pre}')">ابدأ التنزيل</button><label style="font-size:13px;color:var(--mute)"><input type="checkbox" id="fail"> محاكاة انقطاع الاتصال</label></p><div id="cp"></div></div>
  <div class="box"><b>الملفات</b><div style="margin-top:6px"><div class="file"><span>مشروع KiCad 8</span><span class="num">1.1 MB</span></div><div class="file"><span>Gerber + Drill</span><span class="num">4.2 MB</span></div><div class="file"><span>مخطط الدائرة (PDF)</span><span class="num">640 KB</span></div></div></div></div>`},
 notifications(){return `<h1>الإشعارات</h1><p class="sub" style="display:flex;justify-content:space-between;align-items:center">${unread()?`لديك ${unread()} إشعارات غير مقروءة`:'لا توجد إشعارات جديدة'}<button class="btn ghost" ${unread()?'':'disabled'} onclick="readAll()">علّم الكل كمقروء</button></p><div class="box" style="padding:6px 14px">${S.notes.map(n=>`<div class="ntf"><span class="dot ${n.r?'rd':''}"></span><div><b>${n.t}</b><p>${n.d}</p><small>${rel(n.at)}</small></div></div>`).join('')}</div>`},
 profile(){return `<h1>الملف الشخصي</h1><p class="sub">تُستخدم هذه البيانات للتواصل بشأن طلباتك.</p><form class="f box" onsubmit="event.preventDefault();toast('تم حفظ التغييرات')"><label>الاسم الكامل</label><input value="منى عبد الله"><label>رقم الهاتف</label><input dir="ltr" value="01012345678"><label>البريد الإلكتروني</label><input dir="ltr" value="mona@example.com" disabled><p style="margin:14px 0 0"><button class="btn">احفظ التغييرات</button></p></form>`}
};
function orderRow(o){return `<a class="row" href="#/orders/${o.id}"><div><b>${o.p}</b><small><span class="num">${o.id}</span> — ${rel(o.at)}</small></div>${bd(ST,o.st)}</a>`}
function dl(id){const c=S.codes.find(x=>x.pre===id),fail=$('#fail').checked,b=$('#go'),pg=$('#pg'),ps=$('#ps');b.disabled=true;pg.classList.remove('fail');let p=0;
 const t=setInterval(()=>{p+=fail?9:7;if(fail&&p>=55){clearInterval(t);pg.classList.add('fail');ps.textContent='انقطع الاتصال عند 55%. سُجّلت هذه المحاولة كفاشلة.';c.left--;mark(c,true);return}
  if(p>=100){clearInterval(t);pg.firstChild.style.width='100%';ps.textContent='اكتمل التنزيل بنجاح.';c.left--;S.notes.unshift({t:`اكتمل تنزيل «${c.p}»`,d:`بقيت لك ${c.left} محاولات.`,at:Date.now(),r:false});mark(c,false);return}
  pg.firstChild.style.width=p+'%';ps.textContent='جارٍ التنزيل… '+p+'%'},180)}
function mark(c,bad){const d=$('#dots').children;d[c.left].className=bad?'bad':'used';nav('downloads');
 if(bad){$('#cp').innerHTML=S.comp?'<p class="hint">طلب التعويض قيد المراجعة.</p>':'<p style="margin:10px 0 0"><button class="btn ghost" onclick="comp()">اطلب تعويض المحاولة</button></p>';if(c.left>0)$('#go').disabled=false}else if(c.left>0)$('#go').disabled=false}
function comp(){S.comp=true;$('#cp').innerHTML='<p class="hint">تم إرسال طلب التعويض، وستراجعه الإدارة.</p>';toast('تم إرسال طلب التعويض')}
function redeem(){const v=$('#ci').value.trim().toUpperCase(),e=$('#ce');
 if(!/^[A-Z0-9]{4}(-[A-Z0-9]{4}){2}$/.test(v)){e.textContent='الكود يتكوّن من 12 خانة في ثلاث مجموعات، مثل K7QF-92XM-4TLP.';return}
 if(v.startsWith('K7QF')&&act()){e.textContent='';toast('تم التحقق من الكود');location.hash='#/downloads/K7QF'}else e.textContent='هذا الكود غير صالح أو انتهت صلاحيته. تأكد من كتابته كما وصلك.'}
function readAll(){S.notes.forEach(n=>n.r=true);route()}
