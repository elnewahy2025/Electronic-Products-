name = "electronic-products-download"
main = "src/index.ts"
compatibility_date = "2026-11-23"

# Canonical production app origin (non-secret). Override via `.dev.vars` locally.
[vars]
APP_INTERNAL_URL = "https://electronic-products-omega.vercel.app"

[observability]
enabled = true
head_sampling_rate = 0.1
# Worker logs must not contain query tokens or authorization headers;
# verified against workers/download/src/errors.ts, drive.ts and complete.ts.
