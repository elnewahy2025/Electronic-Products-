project_id = "electronic-products"

[api]
port = 55321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 55322
shadow_port = 55320
major_version = 15

[studio]
port = 55323

[local_smtp]
port = 55324

[analytics]
enabled = false

[auth]
site_url = "http://localhost:3010"
additional_redirect_urls = ["http://localhost:3010/auth/callback", "http://localhost:3000/auth/callback"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10

[auth.email]
enabled = true
double_confirm_changes = true
# H-08: guest-email ownership requires a verified auth email. Never disable
# this in non-test environments; E2E users are created with email_confirm=true.
enable_confirmations = true

[auth.external.google]
enabled = true
client_id = "env(GOOGLE_CLIENT_ID)"
secret = "env(GOOGLE_CLIENT_SECRET)"
redirect_uri = "http://localhost:55321/auth/v1/callback"
